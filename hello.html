<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>asiamild 的網站</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #2f6f5e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --card: #1e2227;
        --text: #e8e6e3;
        --muted: #9aa0a6;
        --accent: #6fc2a8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .wave { font-size: 56px; display: inline-block; animation: wave 2s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }
    h1 { margin-top: 16px; font-size: 28px; }
    p { margin-top: 10px; color: var(--muted); line-height: 1.7; }
    button {
      margin-top: 24px;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform .1s;
    }
    button:active { transform: scale(0.96); }
    #count { margin-top: 14px; font-size: 15px; min-height: 1.5em; }
    footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="wave">👋</div>
    <h1>Hello，我是 asiamild！</h1>
    <p>這是我的第一個網頁，<br>用 GitHub Pages 架設成功 🎉</p>
    <button id="btn">點我試試看</button>
    <div id="count"></div>
    <footer>測試網頁 · 2026</footer>
  </main>
  <script>
    let n = 0;
    const msgs = ["你好！", "再點一次？", "網頁有在動喔 ✨", "成功了！"];
    document.getElementById("btn").addEventListener("click", () => {
      n++;
      document.getElementById("count").textContent =
        msgs[Math.min(n - 1, msgs.length - 1)] + `（已點 ${n} 次）`;
    });
  </script>
<!-- 流量統計 GoatCounter（只記錄頁面路徑，不記錄網址後面的房號或管理碼） -->
<script>window.goatcounter = { path: location.pathname || '/' };</script>
<script data-goatcounter="https://asiamild.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
