<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天好晴天</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one sunny column — a smiling sun up top, a "好話" card you tap, a small-joys checklist, and a joy meter. Confetti is the one big moment. */
:root {
  --sky: #dff1ff;
  --sky-deep: #b9e0ff;
  --ink: #23324a;
  --ink-soft: #55657e;
  --sun: #ffc93c;
  --sun-glow: #ffe48a;
  --tangerine: #ff8a3d;
  --leaf: #3fb67a;
  --berry: #ff5d8f;
  --card: #ffffff;
  --card-line: #c9e2f7;
  --cheek: #ff9aa8;
  --face: #6b3b12;
  --sea-btn: #1f8fd6;
  --sea-btn-edge: #136199;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "KaiTi", "Noto Sans TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #14203a; --sky-deep: #1f3157; --ink: #f3f6ff; --ink-soft: #b3bfd8;
    --sun: #ffd15c; --sun-glow: #7a5a12; --tangerine: #ffa46b; --leaf: #5fd39a; --berry: #ff7fa7;
    --card: #1b2a4a; --card-line: #2d4372; --cheek: #ff9aa8; --face: #5a300c; --sea-btn: #2a9ee6; --sea-btn-edge: #0f5a8e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #14203a; --sky-deep: #1f3157; --ink: #f3f6ff; --ink-soft: #b3bfd8;
  --sun: #ffd15c; --sun-glow: #7a5a12; --tangerine: #ffa46b; --leaf: #5fd39a; --berry: #ff7fa7;
  --card: #1b2a4a; --card-line: #2d4372; --cheek: #ff9aa8; --face: #5a300c; --sea-btn: #2a9ee6; --sea-btn-edge: #0f5a8e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(120% 70% at 50% 0%, var(--sky-deep), var(--sky) 60%) fixed, var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
  overflow-x: hidden;
}
main {
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  gap: 28px;
}

/* Hero */
.hero { display: grid; justify-items: center; text-align: center; gap: 8px; }
.sun-wrap { width: min(240px, 62vw); aspect-ratio: 1; max-width: 100%; position: relative; }
.sun-btn {
  all: unset; cursor: pointer; display: block; width: 100%; height: 100%; border-radius: 50%;
}
.sun-btn:focus-visible { outline: 4px dashed var(--tangerine); outline-offset: 6px; }
.rays { transform-origin: 100px 100px; animation: spin 24s linear infinite; }
.rays line { stroke: var(--sun); stroke-width: 9; stroke-linecap: round; }
.sun-body { fill: var(--sun); }
.glow { fill: var(--sun-glow); opacity: .55; }
.eye { fill: var(--face); }
.cheek { fill: var(--cheek); opacity: .7; }
.mouth { fill: none; stroke: var(--face); stroke-width: 5; stroke-linecap: round; transition: d .4s ease; }
.sun-btn:hover .sun-face, .sun-btn.boing .sun-face { animation: boing .6s ease; }
.sun-face { transform-origin: 100px 100px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes boing { 0%,100% { transform: scale(1); } 35% { transform: scale(1.08, .94); } 65% { transform: scale(.96, 1.05); } }

.eyebrow {
  font-family: var(--font-num); font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  font-size: 13px; color: var(--tangerine); margin: 8px 0 0;
}
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 8vw, 52px);
  line-height: 1.2; margin: 0; text-wrap: balance;
}
h1 .hl { color: var(--tangerine); }
.lead { margin: 0; color: var(--ink-soft); max-width: 32em; text-wrap: balance; }

/* Kind words card */
.words {
  background: var(--card); border: 2px solid var(--card-line); border-radius: 28px;
  padding: 28px 24px 24px; display: grid; gap: 18px; text-align: center;
  box-shadow: 0 12px 0 -4px var(--card-line);
}
.quote {
  font-family: var(--font-display); font-size: clamp(22px, 5.4vw, 30px); line-height: 1.5;
  margin: 0; min-height: 3em; display: grid; place-items: center; text-wrap: balance;
}
.quote.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.85); opacity: .2; } to { transform: scale(1); opacity: 1; } }
.btn {
  font: 700 18px/1 var(--font-body); color: #3a2200; background: var(--sun);
  border: 0; border-radius: 999px; padding: 16px 28px; cursor: pointer; justify-self: center;
  box-shadow: 0 6px 0 var(--tangerine); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--tangerine); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tangerine); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

/* Small joys */
.joys h2, .meter h2 {
  font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; text-wrap: balance;
}
.joys p.sub { margin: 0 0 14px; color: var(--ink-soft); font-size: 15px; }
.joy-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.joy {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px;
  background: var(--card); border: 2px solid var(--card-line); cursor: pointer; user-select: none;
  transition: border-color .2s, transform .15s;
}
.joy:hover { transform: translateY(-1px); }
.joy input { position: absolute; opacity: 0; pointer-events: none; }
.joy .box {
  flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--card-line);
  display: grid; place-items: center; transition: background .2s, border-color .2s;
}
.joy .box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.5; fill: none; opacity: 0; transition: opacity .2s; }
.joy input:checked + .box { background: var(--leaf); border-color: var(--leaf); }
.joy input:checked + .box svg { opacity: 1; }
.joy:has(input:checked) { border-color: var(--leaf); }
.joy:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
.joy span.t { min-width: 0; }

/* Meter */
.meter { display: grid; gap: 10px; }
.meter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.meter-num { font-family: var(--font-num); font-weight: 700; font-size: 34px; color: var(--berry); font-variant-numeric: tabular-nums; }
.meter-num small { font-size: 16px; color: var(--ink-soft); font-weight: 500; }
.bar { height: 18px; border-radius: 999px; background: var(--card); border: 2px solid var(--card-line); overflow: hidden; }
.bar i {
  display: block; height: 100%; width: 0%; border-radius: inherit;
  background: linear-gradient(90deg, var(--sun), var(--tangerine), var(--berry));
  transition: width .6s cubic-bezier(.3,1.3,.5,1);
}
.meter-note { margin: 0; color: var(--ink-soft); font-size: 15px; }

footer { text-align: center; color: var(--ink-soft); font-size: 14px; }

/* Under the sea: a hands-off ambient scene */
.btn-sea { background: var(--sea-btn); color: #fff; box-shadow: 0 6px 0 var(--sea-btn-edge); margin-top: 6px; }
.btn-sea:hover { box-shadow: 0 8px 0 var(--sea-btn-edge); }
.btn-sea:active { box-shadow: 0 2px 0 var(--sea-btn-edge); }
#sea { position: fixed; inset: 0; z-index: 30; background: #0d3b66; color: #eaf8ff; }
#sea canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sea-top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sea-stats { white-space: nowrap; font-family: var(--font-num); font-size: 14px; line-height: 1.6; color: rgba(234,248,255,.85); font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,30,60,.5); }
.sea-stats b { font-weight: 700; color: #fff; }
.sea-close {
  font: 700 15px/1 var(--font-body); color: #eaf8ff; background: rgba(255,255,255,.14);
  border: 1.5px solid rgba(255,255,255,.35); border-radius: 999px; padding: 10px 16px; cursor: pointer; backdrop-filter: blur(4px);
}
.sea-close:hover { background: rgba(255,255,255,.24); }
.sea-close:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.sea-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; min-width: 0; max-width: min(280px, 62vw); }
.sea-voice {
  font: 500 14px/1 var(--font-body); color: #eaf8ff; background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.35);
  border-radius: 999px; height: 40px; padding: 0 12px; order: 3; flex: 1 1 100%; min-width: 0; color-scheme: dark; cursor: pointer;
}
.sea-voice:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.sea-voice option { color: #10233a; background: #fff; }
.sea-sound { display: grid; place-items: center; padding: 0; width: 40px; height: 40px; }
.sea-sound svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sea-sound .on { display: none; }
.sea-sound[aria-pressed="true"] { background: rgba(255,214,102,.3); border-color: #ffd666; }
.sea-sound[aria-pressed="true"] .on { display: inline; }
.sea-sound[aria-pressed="true"] .off { display: none; }
.sea-caption {
  position: absolute; left: 0; right: 0; bottom: calc(190px + env(safe-area-inset-bottom, 0px)); text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--font-display); font-size: clamp(20px, 4.6vw, 28px); color: #fffbe8;
  text-shadow: 0 2px 10px rgba(0,25,50,.6); transition: opacity 1.6s ease; text-wrap: balance;
}
.sea-caption.fade { opacity: 0; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  .rays, .quote.pop, .sun-btn:hover .sun-face, .sun-btn.boing .sun-face { animation: none; }
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="sea" hidden role="dialog" aria-modal="true" aria-label="海底世界">
  <canvas id="sea-canvas" aria-hidden="true"></canvas>
  <div class="sea-top">
    <div class="sea-stats">景色 <b id="sea-scene">珊瑚礁</b><br>放鬆時間 <b id="sea-time">0:00</b><br>游過的小魚 <b id="sea-fish">0</b> 條</div>
    <div class="sea-actions">
      <select class="sea-voice" id="sea-voice" aria-label="選擇朗讀的聲音" hidden></select>
      <button class="sea-close sea-sound" id="sea-sound" type="button" aria-pressed="false" aria-label="朗讀字句" title="朗讀字句">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor"></path><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path><path class="off" d="M16 9l6 6M22 9l-6 6"></path></svg>
      </button>
      <button class="sea-close" id="sea-close" type="button">回到岸上</button>
    </div>
  </div>
  <p class="sea-caption" id="sea-caption">什麼都不用做，靜靜看就好。</p>
</div>
<main>
  <header class="hero">
    <div class="sun-wrap">
      <button class="sun-btn" id="sun" type="button" aria-label="摸摸太陽">
        <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
          <g class="rays" id="rays"></g>
          <circle class="glow" cx="100" cy="100" r="70"></circle>
          <g class="sun-face">
            <circle class="sun-body" cx="100" cy="100" r="58"></circle>
            <ellipse class="eye" cx="80" cy="92" rx="6" ry="8"></ellipse>
            <ellipse class="eye" cx="120" cy="92" rx="6" ry="8"></ellipse>
            <ellipse class="cheek" cx="70" cy="112" rx="9" ry="6"></ellipse>
            <ellipse class="cheek" cx="130" cy="112" rx="9" ry="6"></ellipse>
            <path class="mouth" id="mouth" d="M84 116 Q100 126 116 116"></path>
          </g>
        </svg>
      </button>
    </div>
    <p class="eyebrow">Hello, sunshine</p>
    <h1>嗨！今天的你<span class="hl">真的很棒</span></h1>
    <p class="lead">不管今天過得怎樣，你都值得一點點開心。摸摸太陽、抽一句好話，或勾一下今天遇到的小確幸吧。</p>
    <button class="btn btn-sea" id="dive" type="button">進入海底世界 ～</button>
  </header>

  <section class="words" aria-live="polite">
    <p class="quote" id="quote">你笑起來的樣子，比你想像的還要好看。</p>
    <button class="btn" id="more" type="button">再給我一句好話 ✿</button>
  </section>

  <section class="joys">
    <h2>今天的小確幸</h2>
    <p class="sub">有做到哪幾件？每勾一個，就撒一次彩紙。</p>
    <ul class="joy-list" id="joys"></ul>
  </section>

  <section class="meter">
    <div class="meter-row">
      <h2>開心指數</h2>
      <span class="meter-num"><span id="score">0</span><small> / 100</small></span>
    </div>
    <div class="bar" role="progressbar" aria-label="開心指數" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="fill"></i></div>
    <p class="meter-note" id="note">點點上面的東西，指數就會往上跑。</p>
  </section>

  <footer>今天也辛苦了。記得喝水、伸個懶腰，然後對自己好一點。</footer>
</main>

<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Sun rays
  var rays = document.getElementById("rays");
  for (var i = 0; i < 12; i++) {
    var a = (i / 12) * Math.PI * 2;
    var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    var r1 = 78, r2 = i % 2 ? 90 : 97;
    l.setAttribute("x1", 100 + Math.cos(a) * r1);
    l.setAttribute("y1", 100 + Math.sin(a) * r1);
    l.setAttribute("x2", 100 + Math.cos(a) * r2);
    l.setAttribute("y2", 100 + Math.sin(a) * r2);
    rays.appendChild(l);
  }

  // Kind words
  var words = [
    "你笑起來的樣子，比你想像的還要好看。",
    "能認識你，是別人的福氣。",
    "你已經比昨天的自己更進步一點了。",
    "累了就休息，你不需要一直很厲害。",
    "有人正在因為你而感到溫暖。",
    "你的存在本身，就是一件很好的事。",
    "今天的努力，未來的你會感謝它。",
    "慢慢來也沒關係，花也不是同一天開的。",
    "你值得被好好對待，尤其是被你自己。",
    "世界上剛好有一個你，真是太好了。",
    "你做得很好，真的。",
    "下一個轉角，可能就有好事在等你。",
    "你的善良，大家都看得見。",
    "今天也請好好吃飯，你值得一頓好吃的。"
  ];
  var quote = document.getElementById("quote");
  var last = 0;
  document.getElementById("more").addEventListener("click", function (e) {
    var n;
    do { n = Math.floor(Math.random() * words.length); } while (n === last);
    last = n;
    quote.textContent = words[n];
    quote.classList.remove("pop"); void quote.offsetWidth; quote.classList.add("pop");
    var r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 60);
    bump(6);
  });

  // Small joys
  var joys = [
    "喝到一杯好喝的飲料", "看到一隻可愛的貓或狗", "有人對我笑了一下",
    "曬到一點點太陽", "聽到一首喜歡的歌", "吃到喜歡的食物",
    "好好睡了一覺", "完成了一件小事"
  ];
  var list = document.getElementById("joys");
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem("joys") || "{}") || {}; } catch (_) { saved = {}; }
  joys.forEach(function (t, i) {
    var li = document.createElement("li");
    var id = "joy-" + i;
    li.innerHTML = '<label class="joy" for="' + id + '"><input type="checkbox" id="' + id + '">' +
      '<span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></svg></span>' +
      '<span class="t"></span></label>';
    li.querySelector(".t").textContent = t;
    var cb = li.querySelector("input");
    cb.checked = !!saved[i];
    cb.addEventListener("change", function () {
      saved[i] = cb.checked;
      try { localStorage.setItem("joys", JSON.stringify(saved)); } catch (_) {}
      if (cb.checked) {
        var r = li.getBoundingClientRect();
        burst(r.left + 24, r.top + r.height / 2, 40);
        bump(8);
      } else {
        bump(-8);
      }
    });
    list.appendChild(li);
  });

  // Sun click
  var sun = document.getElementById("sun");
  sun.addEventListener("click", function () {
    sun.classList.remove("boing"); void sun.offsetWidth; sun.classList.add("boing");
    var r = sun.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 80);
    bump(5);
  });

  // Joy meter
  var score = 0;
  Object.keys(saved).forEach(function (k) { if (saved[k]) score += 8; });
  var scoreEl = document.getElementById("score"), fill = document.getElementById("fill"),
      bar = document.getElementById("bar"), note = document.getElementById("note"),
      mouth = document.getElementById("mouth");
  var notes = [
    [0, "點點上面的東西，指數就會往上跑。"],
    [20, "嘴角開始上揚了喔！"],
    [45, "心情漸漸放晴中 ☀"],
    [70, "哇，太陽都被你感染了！"],
    [100, "滿分開心！今天就是屬於你的好日子 🎉"]
  ];
  var celebrated = false;
  function render() {
    scoreEl.textContent = score;
    fill.style.width = score + "%";
    bar.setAttribute("aria-valuenow", score);
    for (var i = notes.length - 1; i >= 0; i--) { if (score >= notes[i][0]) { note.textContent = notes[i][1]; break; } }
    var depth = 120 + Math.round(score / 100 * 22);
    mouth.setAttribute("d", "M" + (84 - score / 20) + " 116 Q100 " + depth + " " + (116 + score / 20) + " 116");
  }
  function bump(d) {
    score = Math.max(0, Math.min(100, score + d));
    render();
    if (score === 100 && !celebrated) {
      celebrated = true;
      for (var k = 0; k < 5; k++) {
        (function (k) { setTimeout(function () { burst(innerWidth * (0.15 + k * 0.175), innerHeight * 0.3, 70); }, k * 180); })(k);
      }
    }
    if (score < 100) celebrated = false;
  }
  render();

  // Confetti
  var cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  var parts = [], running = false, dpr = 1;
  var colors = ["#ffc93c", "#ff8a3d", "#3fb67a", "#ff5d8f", "#4aa8ff", "#a77bff"];
  function size() {
    dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); addEventListener("resize", size);
  function burst(x, y, n) {
    if (reduce) n = Math.round(n / 4);
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
      var s = 4 + Math.random() * 7;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, r: Math.random() * 6,
        vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length],
        round: Math.random() < 0.3, life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.18; p.vx *= 0.99; p.vy *= 0.99;

      sx.strokeStyle = col; sx.shadowColor = col;
      sx.lineWidth = w.w * (1 + (P.weedH - 1) * 0.35); sx.beginPath(); sx.moveTo(w.x, by);
      for (var k = 1; k <= seg; k++) sx.lineTo(w.x + Math.sin(t * 0.9 + w.ph + k * 0.4) * k * 2.2 * (0.6 + P.weedH * 0.4), by - h * k / seg);
      sx.stroke();
    });
    sx.shadowBlur = 0;
    // bubbles
    if (Math.random() < 0.08 * seaDt && weeds.length) {
      var w0 = weeds[Math.floor(Math.random() * weeds.length)];
      bubbles.push({ x: w0.x, y: sandY(w0.x), r: rnd(2, 6), v: rnd(0.5, 1.2), ph: rnd(0, 6.28) });
    }
    sx.strokeStyle = "rgba(255,255,255,.7)"; sx.lineWidth = 1.2;
    for (var b = bubbles.length - 1; b >= 0; b--) {
      var bb = bubbles[b]; bb.y -= bb.v * speed * seaDt; bb.x += Math.sin(t * 2 + bb.ph) * 0.3;
      if (bb.y < -10) { bubbles.splice(b, 1); continue; }
      sx.beginPath(); sx.arc(bb.x, bb.y, bb.r, 0, 7); sx.stroke();
      sx.fillStyle = "rgba(255,255,255,.5)"; sx.beginPath(); sx.arc(bb.x - bb.r * 0.35, bb.y - bb.r * 0.35, bb.r * 0.25, 0, 7); sx.fill();
    }
    var secs = Math.floor((now - seaStart) / 1000);
    timeEl.textContent = Math.floor(secs / 60) + ":" + ("0" + secs % 60).slice(-2);
    seaRaf = requestAnimationFrame(seaFrame);
  }
  function showCaption(c) {
    capEl.classList.add("fade");
    setTimeout(function () { capEl.textContent = c; capEl.classList.remove("fade"); say(c); }, 1700);
  }
  function nextCaption() {
    var pool = common.concat(currentScene().lines, currentScene().lines), c;
    do { c = pool[Math.floor(Math.random() * pool.length)]; } while (c === capEl.textContent);
    showCaption(c);
  }
  function enterNextScene() {
    var nx = scenes[nextIdx];
    sceneEl.textContent = nx.name;
    clearInterval(capTimer); capTimer = setInterval(nextCaption, CAPTION_MS);
    showCaption(nx.intro);
  }
  function openSea() {
    seaOn = true; sea.hidden = false; document.documentElement.style.overflow = "hidden";
    sceneClock = 0; P = null; nextIdx = pickNext(sceneIdx);
    buildSea(); fishCount = 0; fishEl.textContent = "0";
    sceneEl.textContent = currentScene().name;
    capEl.textContent = common[0]; capEl.classList.remove("fade");
    say(common[0]);
    seaStart = seaLast = performance.now();
    seaRaf = requestAnimationFrame(seaFrame);
    capTimer = setInterval(nextCaption, CAPTION_MS);
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }, function () {}); } catch (_) {}
    document.getElementById("sea-close").focus();
    bump(10);
  }
  function closeSea() {
    seaOn = false; sea.hidden = true; document.documentElement.style.overflow = "";
    cancelAnimationFrame(seaRaf); clearInterval(capTimer);
    if (synth) synth.cancel();
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
    document.getElementById("dive").focus();
  }
  // Read captions aloud when the speaker is on
  var synth = window.speechSynthesis || null, soundBtn = document.getElementById("sea-sound"), soundOn = false,
      voiceSel = document.getElementById("sea-voice"), voices = [], zhVoice = null, savedVoice = "";
  try { savedVoice = localStorage.getItem("seaVoice2") || ""; } catch (_) {}
  // Mei-Jia (美佳) first, then clearer voices: Taiwan Mandarin, natural/online voices; Cantonese last
  function voiceScore(v) {
    var sc = 0;
    if (/mei-?jia|美佳/i.test(v.name)) sc += 200;
    if (/zh[-_]TW/i.test(v.lang)) sc += 40; else if (/zh[-_]CN|cmn/i.test(v.lang)) sc += 20;
    if (/zh[-_]HK|yue/i.test(v.lang)) sc -= 30;
    if (/natural|online|neural|google|premium|enhanced/i.test(v.name)) sc += 25;
    if (/mei-?jia|hsiaochen|hsiaoyu|yating|ting-?ting|xiaoxiao/i.test(v.name)) sc += 10;
    return sc;
  }
  function pickVoice() {
    if (!synth) return;
    voices = synth.getVoices().filter(function (v) { return /^(zh|cmn|yue)/i.test(v.lang); })
      .sort(function (a, b) { return voiceScore(b) - voiceScore(a); });
    zhVoice = voices.filter(function (v) { return v.name === savedVoice; })[0] || voices[0] || null;
    voiceSel.innerHTML = "";
    voices.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v.name; o.textContent = v.name.replace(/^Microsoft |^Google /, "") + "（" + v.lang + "）";
      if (v === zhVoice) o.selected = true;
      voiceSel.appendChild(o);
    });
    voiceSel.hidden = !soundOn || voices.length < 2;
  }
  // Speak ellipses as short pauses instead of reading them out
  function speakable(text) { return text.replace(/……|…/g, "，").replace(/[～~]/g, ""); }
  function say(text) {
    if (!soundOn || !synth || !seaOn) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(speakable(text));
    u.lang = zhVoice ? zhVoice.lang : "zh-TW";
    try { if (zhVoice) u.voice = zhVoice; } catch (_) {}
    u.rate = 0.9; u.pitch = 1; u.volume = 1;
    synth.speak(u);
  }
  if (synth) { synth.onvoiceschanged = pickVoice; }
  else { soundBtn.disabled = true; soundBtn.title = "這個瀏覽器不支援朗讀"; }
  try { soundOn = !!synth && localStorage.getItem("seaSound") === "1"; } catch (_) {}
  soundBtn.setAttribute("aria-pressed", soundOn);
  pickVoice();
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.setAttribute("aria-pressed", soundOn);
    try { localStorage.setItem("seaSound", soundOn ? "1" : "0"); } catch (_) {}
    voiceSel.hidden = !soundOn || voices.length < 2;
    if (soundOn) say(capEl.textContent); else if (synth) synth.cancel();
  });
  voiceSel.addEventListener("change", function () {
    zhVoice = voices.filter(function (v) { return v.name === voiceSel.value; })[0] || zhVoice;
    try { localStorage.setItem("seaVoice2", voiceSel.value); } catch (_) {}
    say(capEl.textContent);
  });

  document.getElementById("dive").addEventListener("click", openSea);
  document.getElementById("sea-close").addEventListener("click", closeSea);
  addEventListener("keydown", function (e) { if (e.key === "Escape" && seaOn) closeSea(); });
  addEventListener("resize", function () { if (seaOn) buildSea(); });

  // A small welcome burst
  setTimeout(function () { burst(innerWidth / 2, Math.min(innerHeight * 0.25, 200), 70); }, 500);
})();
</script>
